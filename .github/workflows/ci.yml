name: PoC checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: services/engine/requirements.txt
      - run: python -m pip install -r services/engine/requirements.txt
      - run: npm run contracts:check
      - run: npm run fixtures:check
      - run: npm test
      - run: python -m unittest discover -s services/engine/tests -v
      - run: npm run typecheck
      - run: npm run build
